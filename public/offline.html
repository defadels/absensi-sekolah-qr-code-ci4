<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9c27b0">
  <title>Anda sedang offline | Absensi Sekolah</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: #f6f3f7; color: #29232d; }
    main { width: min(100%, 440px); padding: clamp(24px, 7vw, 40px); border-radius: 18px; background: #fff; box-shadow: 0 12px 36px rgba(42, 22, 49, .12); text-align: center; }
    img { display: block; width: 72px; height: 72px; margin: 0 auto 20px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.35rem, 5vw, 1.75rem); line-height: 1.25; }
    p { margin: 0; color: #625968; line-height: 1.6; }
    button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 8px; background: #9c27b0; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #d9a2e2; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="./assets/img/pwa-icon-192.png" alt="">
    <h1>Koneksi internet tidak tersedia</h1>
    <p>Halaman dan data absensi perlu dimuat dari server. Periksa koneksi Anda, lalu coba lagi.</p>
    <button type="button" onclick="window.location.reload()">Coba lagi</button>
  </main>
</body>
</html>
